name: Build Zuxrash AI APK

on:
  push:
    paths:
      - 'ZuxrashAI_Android.zip'
      - '.github/workflows/build-zuxrash-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q ZuxrashAI_Android.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" | head
          ls -la "$ANDROID_HOME/build-tools" | tail

      - name: Build debug APK
        working-directory: ZuxrashAI_Android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zuxrash-ai-apk
          path: ZuxrashAI_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
