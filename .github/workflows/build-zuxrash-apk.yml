name: Build Zuxrash AI APK

on:
  push:
    paths:
      - 'ZuxrashAI_Android.zip'
      - 'android/MainActivity.java'
      - 'android/ic_launcher.xml'
      - '.github/workflows/build-zuxrash-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q ZuxrashAI_Android.zip

      - name: Patch Android login wrapper
        run: |
          cp android/MainActivity.java             ZuxrashAI_Android/app/src/main/java/com/bekiuz/zuxrash/MainActivity.java
          cp android/ic_launcher.xml ZuxrashAI_Android/app/src/main/res/drawable/ic_launcher.xml
          sed -i "s/versionCode 1/versionCode 2/; s/versionName '1.0'/versionName '1.1'/" ZuxrashAI_Android/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" | head
          ls -la "$ANDROID_HOME/build-tools" | tail

      - name: Build debug APK
        working-directory: ZuxrashAI_Android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zuxrash-ai-apk
          path: ZuxrashAI_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
