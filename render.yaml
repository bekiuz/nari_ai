services:
  - type: web
    name: zuxrash-ai-backend
    runtime: node
    branch: apk-ready
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
